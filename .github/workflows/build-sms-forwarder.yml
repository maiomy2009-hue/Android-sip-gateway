name: Build SMS Relay APK

on:
  workflow_dispatch:
  push:
    branches: [ sms-forwarder-independent ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.1.0"
      - name: Reassemble independent source archive
        run: cat sms-forwarder-source.part* | base64 -d > sms-forwarder-source.zip && unzip -oq sms-forwarder-source.zip -d .
      - name: Build debug APK
        run: ./gradlew -p sms-forwarder --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SMS-Relay-debug-apk
          path: sms-forwarder/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
